<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kharcha Hisab & Len-Den Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 100px; }
    
    header { background: #1e293b; padding: 12px 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #334155; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 18px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    .lang-btn, .profile-btn { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .install-btn { background: #10b981; color: white; border: none; padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: 12px; display: none; }

    .container { padding: 12px; max-width: 600px; margin: auto; }

    /* Profile Banner */
    .user-greeting { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .greeting-text h3 { font-size: 14px; color: #f8fafc; }
    .greeting-text p { font-size: 11px; color: #94a3b8; }
    .balance-box { text-align: right; }
    .balance-box h4 { font-size: 10px; color: #94a3b8; }
    .balance-box p { font-size: 14px; font-weight: 700; color: #38bdf8; }

    /* Summary Grid */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .summary-card { background: #1e293b; padding: 8px 6px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
    .summary-card h4 { font-size: 10px; color: #94a3b8; margin-bottom: 3px; }
    .summary-card p { font-size: 13px; font-weight: 700; }
    .summary-card.bills p { color: #f87171; }
    .summary-card.emi p { color: #fbbf24; }
    .summary-card.sip p { color: #34d399; }

    /* Len-Den Mini Strip */
    .lenden-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .lenden-card { background: #1e293b; padding: 8px 12px; border-radius: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .lenden-card.get { border-left: 4px solid #10b981; }
    .lenden-card.give { border-left: 4px solid #ef4444; }
    .lenden-card h5 { font-size: 10px; color: #94a3b8; }
    .lenden-card p { font-size: 14px; font-weight: 700; }

    /* Search & Filter */
    .search-bar { width: 100%; padding: 9px 12px; border-radius: 10px; background: #1e293b; border: 1px solid #334155; color: white; font-size: 13px; margin-bottom: 10px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; font-size: 11px; white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: 700; border-color: #38bdf8; }

    /* Cards */
    .item-card { background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .item-card.overdue { border-left: 5px solid #ef4444; background: rgba(239, 68, 68, 0.08); }
    .item-card.duesoon { border-left: 5px solid #f59e0b; }
    .item-card.paid { border-left: 5px solid #10b981; opacity: 0.65; }
    .item-left { display: flex; gap: 10px; align-items: center; }
    .item-icon { font-size: 20px; background: #0f172a; padding: 8px; border-radius: 8px; }
    .item-title { font-weight: 600; font-size: 14px; }
    .item-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .item-right { text-align: right; }
    .item-amount { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .badge.paid { background: #064e3b; color: #34d399; }
    .badge.overdue { background: #7f1d1d; color: #fca5a5; }
    .badge.duesoon { background: #78350f; color: #fcd34d; }
    .badge.upcoming { background: #1e293b; color: #94a3b8; border: 1px solid #475569; }
    
    .btn-wa { background: #25D366; color: white; border: none; padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; margin-right: 4px; }
    .btn-del { background: none; border: none; color: #64748b; font-size: 13px; cursor: pointer; margin-left: 4px; }

    /* Modal / Form */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; padding: 14px; }
    .modal.active { display: flex; }
    .modal-box { background: #1e293b; width: 100%; max-width: 480px; padding: 18px; border-radius: 14px; border: 1px solid #334155; max-height: 90vh; overflow-y: auto; }
    .modal-box h3 { margin-bottom: 12px; font-size: 16px; color: #38bdf8; }
    .input-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    input, select { width: 100%; padding: 9px; border-radius: 8px; background: #0f172a; border: 1px solid #475569; color: white; font-size: 13px; }
    .form-actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn-save { flex: 1; background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-close { background: #475569; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; }

    /* Footer / FAB */
    .fab { position: fixed; bottom: 20px; right: 20px; background: #38bdf8; color: #0f172a; width: 54px; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; font-size: 26px; border: none; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); cursor: pointer; font-weight: bold; z-index: 50; }
    .backup-box { display: flex; justify-content: space-between; margin-top: 25px; padding: 12px; background: #1e293b; border-radius: 10px; border: 1px dashed #334155; }
    .btn-backup { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo">📊 <span id="appTitle">Kharcha & Len-Den</span></div>
      <div class="header-btns">
        <button id="installAppBtn" class="install-btn">📲 Install</button>
        <button class="lang-btn" onclick="toggleLang()">🌐 <span id="langTxt">English</span></button>
        <button class="profile-btn" onclick="openProfile()">👤</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Profile Greeting -->
    <div class="user-greeting">
      <div class="greeting-text">
        <h3 id="greetUser">नमस्ते!</h3>
        <p id="budgetText">मासिक बजट: ₹0</p>
      </div>
      <div class="balance-box">
        <h4 id="lblRem">बचत / शेष राशि</h4>
        <p id="remBalance">₹0</p>
      </div>
    </div>

    <!-- Summary (Bills, EMI, SIP) -->
    <div class="summary-grid">
      <div class="summary-card bills">
        <h4 id="lblBills">कुल बिल</h4>
        <p id="totalBills">₹0</p>
      </div>
      <div class="summary-card emi">
        <h4 id="lblEMI">कुल EMI</h4>
        <p id="totalEMI">₹0</p>
      </div>
      <div class="summary-card sip">
        <h4 id="lblSIP">कुल SIP</h4>
        <p id="totalSIP">₹0</p>
      </div>
    </div>

    <!-- Len-Den Strip -->
    <div class="lenden-strip">
      <div class="lenden-card get">
        <div>
          <h5 id="lblToReceive">लेने हैं (Receivable)</h5>
          <p id="totalReceive" style="color:#34d399;">₹0</p>
        </div>
        <span style="font-size:20px;">🤝</span>
      </div>
      <div class="lenden-card give">
        <div>
          <h5 id="lblToPay">देने हैं (Payable)</h5>
          <p id="totalPay" style="color:#f87171;">₹0</p>
        </div>
        <span style="font-size:20px;">🤲</span>
      </div>
    </div>

    <!-- Search -->
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 नाम या बैंक से खोजें..." oninput="render()">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="filterItems('all', this)" id="tabAll">सभी (All)</button>
      <button class="tab-btn" onclick="filterItems('lenden', this)">🤝 लेन-देन (उधार)</button>
      <button class="tab-btn" onclick="filterItems('credit_card', this)">💳 क्रेडिट कार्ड</button>
      <button class="tab-btn" onclick="filterItems('utility', this)">⚡ बिल & रिचार्ज</button>
      <button class="tab-btn" onclick="filterItems('emi', this)">🏦 लोन EMI</button>
      <button class="tab-btn" onclick="filterItems('sip', this)">📈 SIP & निवेश</button>
    </div>

    <!-- Items List -->
    <div id="itemList"></div>

    <!-- Backup & Restore -->
    <div class="backup-box">
      <div>
        <p style="font-size:12px; font-weight:600;" id="lblBackup">डेटा बैकअप (Safe Backup)</p>
        <p style="font-size:10px; color:#94a3b8;" id="lblBackupSub">फोन खोने पर भी डेटा सुरक्षित रखें</p>
      </div>
      <button class="btn-backup" onclick="exportData()">📥 बैकअप लें</button>
    </div>
  </div>

  <button class="fab" onclick="openEntryModal()">+</button>

  <!-- ENTRY MODAL -->
  <div id="entryModal" class="modal">
    <div class="modal-box">
      <h3 id="modalHeading">नई एंट्री जोड़ें</h3>
      <form id="entryForm" onsubmit="saveEntry(event)">
        
        <div class="input-group">
          <label id="lblCat">कैटेगरी (Category)</label>
          <select id="entryCategory" onchange="updateSubOptions()" required>
            <option value="lend_given">🤝 पैसे दिए (मुझे वापस लेने हैं - Udhar Given)</option>
            <option value="lend_taken">🤲 पैसे लिए (मुझे वापस देने हैं - Udhar Taken)</option>
            <option value="credit_card">💳 क्रेडिट कार्ड बिल (Credit Card)</option>
            <option value="utility">💡 बिजली / पानी बिल (Utility)</option>
            <option value="telecom">📱 फोन / रिचार्ज / DTH (Telecom)</option>
            <option value="emi">🏦 लोन EMI (Home / Car / Personal)</option>
            <option value="sip">📈 SIP / म्यूचुअल फंड (Investment)</option>
          </select>
        </div>

        <!-- Bank / Preset Dropdown (Hidden if Len-Den) -->
        <div class="input-group" id="presetGroup">
          <label id="lblProvider">बैंक / कंपनी चुनें</label>
          <select id="entryPreset" onchange="handlePresetChange()"></select>
        </div>

        <!-- Custom / Person Name -->
        <div class="input-group" id="customTitleGroup">
          <label id="lblCustomName">व्यक्ति का नाम (Person Name)</label>
          <input type="text" id="entryCustomTitle" placeholder="उदा: राहुल शर्मा">
        </div>

        <!-- Mobile / WhatsApp Number (Only for Len-Den) -->
        <div class="input-group" id="phoneGroup">
          <label id="lblPhone">व्हाट्सएप नंबर (Payment Reminder भेजने के लिए)</label>
          <input type="tel" id="entryPhone" placeholder="उदा: 9876543210 (10 अंक)">
        </div>

        <div class="input-group">
          <label id="lblAmt">राशि (Amount ₹)</label>
          <input type="number" id="entryAmount" placeholder="उदा: 5000" required>
        </div>

        <div class="input-group">
          <label id="lblDate">तारीख / वापसी की तारीख (Due Date)</label>
          <input type="date" id="entryDate" required>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-close" onclick="closeModal('entryModal')" id="btnCancel">कैंसिल</button>
          <button type="submit" class="btn-save" id="btnSave">सेव करें (Save)</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal">
    <div class="modal-box">
      <h3>मेरी प्रोफ़ाइल (My Profile)</h3>
      <div class="input-group">
        <label>आपका नाम (Your Name)</label>
        <input type="text" id="profName" placeholder="उदा: राहुल कुमार">
      </div>
      <div class="input-group">
        <label>मंथली सैलरी / इनकम ₹ (Monthly Budget)</label>
        <input type="number" id="profBudget" placeholder="उदा: 50000">
      </div>
      <div class="form-actions">
        <button type="button" class="btn-close" onclick="closeModal('profileModal')">बंद करें</button>
        <button type="button" class="btn-save" onclick="saveProfile()">सेव करें</button>
      </div>
    </div>
  </div>

  <script>
    const bankList = ["HDFC Bank", "SBI (State Bank)", "ICICI Bank", "Axis Bank", "Kotak Mahindra", "Punjab National Bank", "Bank of Baroda", "IDFC First", "IndusInd Bank", "RBL Bank", "OneCard", "Other (अन्य)"];
    const telecomList = ["Jio Prepaid/Postpaid", "Airtel", "Vi (Vodafone Idea)", "BSNL", "Tata Play (DTH)", "Airtel Digital TV", "Dish TV", "Other (अन्य)"];
    const sipList = ["Parag Parikh Flexi Cap", "Nippon India Small Cap", "Quant Small Cap", "SBI Mutual Fund", "HDFC Top 100", "ICICI Prudential", "Mirae Asset Large Cap", "Motilal Oswal", "Groww Balance", "Zerodha Coin", "Other (अन्य)"];
    const utilityList = ["Bijli Bill (Electricity)", "Pani Bill (Water)", "Gas Cylinder / Piped Gas", "WiFi / Broadband", "House Rent", "Other (अन्य)"];

    let lang = localStorage.getItem('kh_lang') || 'hi';
    let data = JSON.parse(localStorage.getItem('my_hisab_data')) || [];
    let profile = JSON.parse(localStorage.getItem('my_hisab_profile')) || { name: 'दोस्त', budget: 0 };
    let currentCategory = 'all';

    const t = {
      hi: {
        appTitle: "खर्चा & लेन-देन", langBtn: "English", greet: "नमस्ते", budget: "मासिक बजट", rem: "बचत / शेष राशि",
        bills: "कुल बिल", emi: "कुल EMI", sip: "कुल SIP", toReceive: "लेने हैं (Receivable)", toPay: "देने हैं (Payable)",
        search: "🔍 नाम, बैंक या व्यक्ति खोजें...", all: "सभी (All)", modalAdd: "नई एंट्री जोड़ें",
        cat: "कैटेगरी चुनें", provider: "बैंक / कंपनी चुनें", customPerson: "व्यक्ति का नाम", customBank: "हाथ से नाम लिखें",
        phone: "व्हाट्सएप नंबर (Reminder के लिए)", amt: "रुपये (Amount ₹)", date: "तारीख / ड्यू डेट", cancel: "कैंसिल",
        save: "सेव करें", backup: "डेटा बैकअप (Safe Backup)", backupSub: "फोन खोने पर भी डेटा सुरक्षित रखें",
        paid: "✓ चुकता (Settled)", overdue: "⚠️ Overdue!", duesoon: "⏳ Due Soon", upcoming: "Pending"
      },
      en: {
        appTitle: "Kharcha & Len-Den", langBtn: "हिंदी", greet: "Hello", budget: "Monthly Budget", rem: "Remaining Savings",
        bills: "Total Bills", emi: "Total EMI", sip: "Total SIP", toReceive: "To Receive", toPay: "To Pay",
        search: "🔍 Search name, bank or person...", all: "All", modalAdd: "Add New Entry",
        cat: "Select Category", provider: "Select Bank / Provider", customPerson: "Person's Name", customBank: "Custom Name",
        phone: "WhatsApp Number (For Reminder)", amt: "Amount (₹)", date: "Due Date", cancel: "Cancel",
        save: "Save Entry", backup: "Data Backup (Safe Backup)", backupSub: "Keep data safe even if phone changes",
        paid: "✓ Settled", overdue: "⚠️ Overdue!", duesoon: "⏳ Due Soon", upcoming: "Pending"
      }
    };

    function toggleLang() {
      lang = (lang === 'hi') ? 'en' : 'hi';
      localStorage.setItem('kh_lang', lang);
      applyLang();
      render();
    }

    function applyLang() {
      const cur = t[lang];
      document.getElementById('appTitle').innerText = cur.appTitle;
      document.getElementById('langTxt').innerText = cur.langBtn;
      document.getElementById('budgetText').innerText = `${cur.budget}: ₹${profile.budget.toLocaleString('en-IN')}`;
      document.getElementById('lblRem').innerText = cur.rem;
      document.getElementById('lblBills').innerText = cur.bills;
      document.getElementById('lblEMI').innerText = cur.emi;
      document.getElementById('lblSIP').innerText = cur.sip;
      document.getElementById('lblToReceive').innerText = cur.toReceive;
      document.getElementById('lblToPay').innerText = cur.toPay;
      document.getElementById('searchInput').placeholder = cur.search;
      document.getElementById('tabAll').innerText = cur.all;
      document.getElementById('modalHeading').innerText = cur.modalAdd;
      document.getElementById('lblCat').innerText = cur.cat;
      document.getElementById('lblProvider').innerText = cur.provider;
      document.getElementById('lblPhone').innerText = cur.phone;
      document.getElementById('lblAmt').innerText = cur.amt;
      document.getElementById('lblDate').innerText = cur.date;
      document.getElementById('btnCancel').innerText = cur.cancel;
      document.getElementById('btnSave').innerText = cur.save;
      document.getElementById('lblBackup').innerText = cur.backup;
      document.getElementById('lblBackupSub').innerText = cur.backupSub;
      document.getElementById('greetUser').innerText = `${cur.greet}, ${profile.name} 👋`;
    }

    function openProfile() {
      document.getElementById('profName').value = profile.name === 'दोस्त' ? '' : profile.name;
      document.getElementById('profBudget').value = profile.budget || '';
      document.getElementById('profileModal').classList.add('active');
    }

    function saveProfile() {
      const name = document.getElementById('profName').value.trim() || (lang === 'hi' ? 'दोस्त' : 'Friend');
      const budget = parseFloat(document.getElementById('profBudget').value) || 0;
      profile = { name, budget };
      localStorage.setItem('my_hisab_profile', JSON.stringify(profile));
      closeModal('profileModal');
      applyLang();
      render();
    }

    function openEntryModal() {
      document.getElementById('entryForm').reset();
      document.getElementById('entryDate').valueAsDate = new Date();
      updateSubOptions();
      document.getElementById('entryModal').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function updateSubOptions() {
      const cat = document.getElementById('entryCategory').value;
      const presetGroup = document.getElementById('presetGroup');
      const customGroup = document.getElementById('customTitleGroup');
      const phoneGroup = document.getElementById('phoneGroup');
      const presetSelect = document.getElementById('entryPreset');

      if (cat === 'lend_given' || cat === 'lend_taken') {
        presetGroup.style.display = 'none';
        customGroup.style.display = 'block';
        phoneGroup.style.display = 'block';
        document.getElementById('lblCustomName').innerText = t[lang].customPerson;
        document.getElementById('entryCustomTitle').required = true;
      } else {
        presetGroup.style.display = 'block';
        phoneGroup.style.display = 'none';
        document.getElementById('lblCustomName').innerText = t[lang].customBank;
        
        let list = [];
        if(cat === 'credit_card' || cat === 'emi') list = bankList;
        else if(cat === 'telecom') list = telecomList;
        else if(cat === 'sip') list = sipList;
        else if(cat === 'utility') list = utilityList;

        presetSelect.innerHTML = '';
        list.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item;
          opt.innerText = item;
          presetSelect.appendChild(opt);
        });
        handlePresetChange();
      }
    }

    function handlePresetChange() {
      const cat = document.getElementById('entryCategory').value;
      if (cat === 'lend_given' || cat === 'lend_taken') return;
      const preset = document.getElementById('entryPreset').value;
      const customGroup = document.getElementById('customTitleGroup');
      if(preset.includes("Other")) {
        customGroup.style.display = 'block';
        document.getElementById('entryCustomTitle').required = true;
      } else {
        customGroup.style.display = 'none';
        document.getElementById('entryCustomTitle').required = false;
      }
    }

    function saveEntry(e) {
      e.preventDefault();
      const cat = document.getElementById('entryCategory').value;
      let title = "";

      if(cat === 'lend_given' || cat === 'lend_taken') {
        title = document.getElementById('entryCustomTitle').value.trim();
      } else {
        const preset = document.getElementById('entryPreset').value;
        const customTitle = document.getElementById('entryCustomTitle').value.trim();
        title = preset.includes("Other") && customTitle ? customTitle : preset;
      }

      const phone = document.getElementById('entryPhone').value.trim();
      const amount = parseFloat(document.getElementById('entryAmount').value);
      const date = document.getElementById('entryDate').value;

      data.push({
        id: Date.now(),
        category: cat,
        title: title,
        phone: phone,
        amount: amount,
        date: date,
        status: 'unpaid'
      });

      localStorage.setItem('my_hisab_data', JSON.stringify(data));
      closeModal('entryModal');
      render();
    }

    function toggleStatus(id) {
      data = data.map(item => item.id === id ? { ...item, status: item.status === 'paid' ? 'unpaid' : 'paid' } : item);
      localStorage.setItem('my_hisab_data', JSON.stringify(data));
      render();
    }

    function deleteItem(id) {
      if(confirm(lang === 'hi' ? 'क्या आप इसे हटाना चाहते हैं?' : 'Do you want to delete this?')) {
        data = data.filter(item => item.id !== id);
        localStorage.setItem('my_hisab_data', JSON.stringify(data));
        render();
      }
    }

    function filterItems(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function sendWhatsAppReminder(name, phone, amount, date) {
      let cleanPhone = phone ? phone.replace(/\D/g, '') : '';
      if(cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

      const text = encodeURIComponent(
        lang === 'hi'
          ? `नमस्ते ${name} जी! 🙏\nयह एक दोस्ताना रिमाइंडर है कि आपके पास ₹${amount.toLocaleString('en-IN')} का भुगतान बाकी है (तारीख: ${date})।\nकृपया समय पर ट्रांसफर करने का कष्ट करें। धन्यवाद!`
          : `Hello ${name}! 🙏\nThis is a friendly reminder regarding pending payment of ₹${amount.toLocaleString('en-IN')} (Due date: ${date}).\nPlease clear it at your earliest convenience. Thank you!`
      );

      const url = cleanPhone ? `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${text}` : `https://api.whatsapp.com/send?text=${text}`;
      window.open(url, '_blank');
    }

    function getDueStatus(dateStr, status) {
      if(status === 'paid') return { cls: 'paid', text: t[lang].paid };
      const today = new Date();
      today.setHours(0,0,0,0);
      const due = new Date(dateStr);
      due.setHours(0,0,0,0);

      const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
      if(diffDays < 0) return { cls: 'overdue', text: t[lang].overdue };
      if(diffDays <= 3) return { cls: 'duesoon', text: t[lang].duesoon };
      return { cls: 'upcoming', text: t[lang].upcoming };
    }

    function render() {
      const listEl = document.getElementById('itemList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      listEl.innerHTML = '';

      let billTotal = 0, emiTotal = 0, sipTotal = 0, toReceive = 0, toPay = 0;

      data.forEach(item => {
        if(item.status !== 'paid') {
          if(item.category === 'credit_card' || item.category === 'utility' || item.category === 'telecom') billTotal += item.amount;
          if(item.category === 'emi') emiTotal += item.amount;
          if(item.category === 'sip') sipTotal += item.amount;
          if(item.category === 'lend_given') toReceive += item.amount;
          if(item.category === 'lend_taken') toPay += item.amount;
        }
      });

      document.getElementById('totalBills').innerText = '₹' + billTotal.toLocaleString('en-IN');
      document.getElementById('totalEMI').innerText = '₹' + emiTotal.toLocaleString('en-IN');
      document.getElementById('totalSIP').innerText = '₹' + sipTotal.toLocaleString('en-IN');
      document.getElementById('totalReceive').innerText = '₹' + toReceive.toLocaleString('en-IN');
      document.getElementById('totalPay').innerText = '₹' + toPay.toLocaleString('en-IN');

      const totalOutflow = billTotal + emiTotal + sipTotal + toPay;
      const remaining = profile.budget > 0 ? (profile.budget - totalOutflow) : 0;
      document.getElementById('remBalance').innerText = '₹' + remaining.toLocaleString('en-IN');
      document.getElementById('remBalance').style.color = remaining < 0 ? '#ef4444' : '#34d399';

      let filtered = data;
      if (currentCategory === 'lenden') {
        filtered = data.filter(d => d.category === 'lend_given' || d.category === 'lend_taken');
      } else if (currentCategory !== 'all') {
        filtered = data.filter(d => d.category === currentCategory);
      }

      if(search) {
        filtered = filtered.filter(d => d.title.toLowerCase().includes(search));
      }

      filtered.sort((a,b) => new Date(a.date) - new Date(b.date));

      if(filtered.length === 0) {
        listEl.innerHTML = `<p style="text-align:center; color:#64748b; margin-top:35px; font-size:13px;">${lang === 'hi' ? 'कोई एंट्री नहीं मिली। नीचे + दबाकर जोड़ें!' : 'No entries found. Tap + to add!'}</p>`;
        return;
      }

      const icons = { credit_card: '💳', utility: '⚡', telecom: '📱', emi: '🏦', sip: '📈', lend_given: '🤝', lend_taken: '🤲' };

      filtered.forEach(item => {
        const dueInfo = getDueStatus(item.date, item.status);
        const isLendGiven = item.category === 'lend_given';
        const isLendTaken = item.category === 'lend_taken';
        
        let subText = `📅 ${item.date}`;
        if(isLendGiven) subText += ` • <span style="color:#34d399;font-weight:600;">लेने हैं</span>`;
        if(isLendTaken) subText += ` • <span style="color:#f87171;font-weight:600;">देने हैं</span>`;

        const card = document.createElement('div');
        card.className = `item-card ${dueInfo.cls}`;
        card.innerHTML = `
          <div class="item-left">
            <span class="item-icon">${icons[item.category] || '📄'}</span>
            <div>
              <div class="item-title">${item.title}</div>
              <div class="item-sub">${subText}</div>
            </div>
          </div>
          <div class="item-right">
            <div class="item-amount" style="color:${isLendGiven ? '#34d399' : (isLendTaken ? '#f87171' : '#f8fafc')}">
              ₹${item.amount.toLocaleString('en-IN')}
            </div>
            <div>
              ${isLendGiven && item.status !== 'paid' ? `
                <button class="btn-wa" onclick="sendWhatsAppReminder('${item.title}', '${item.phone || ''}', ${item.amount}, '${item.date}')">
                  💬 WhatsApp
                </button>
              ` : ''}
              <span class="badge ${dueInfo.cls}" onclick="toggleStatus(${item.id})">
                ${dueInfo.text}
              </span>
              <button class="btn-del" onclick="deleteItem(${item.id})">🗑️</button>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function exportData() {
      const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", jsonStr);
      dlAnchor.setAttribute("download", `Kharcha_Lenden_Backup_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchor.click();
    }

    // PWA Install
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    applyLang();
    render();
  </script>
</body>
</html>
