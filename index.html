<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hisab - Bill & EMI Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 90px; }
    header { background: #1e293b; padding: 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #334155; }
    .header-title { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 20px; font-weight: 700; color: #38bdf8; }
    .install-btn { background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: none; }
    
    .container { padding: 16px; max-width: 600px; margin: auto; }
    
    /* Summary Cards */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .summary-card { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
    .summary-card h4 { font-size: 11px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
    .summary-card p { font-size: 16px; font-weight: 700; color: #f8fafc; }
    .summary-card.bills p { color: #f87171; }
    .summary-card.emi p { color: #fbbf24; }
    .summary-card.sip p { color: #34d399; }

    /* Category Filter Tabs */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 14px; scrollbar-width: none; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; font-weight: 600; border-color: #38bdf8; }

    /* Entry Form Modal */
    .form-box { background: #1e293b; padding: 16px; border-radius: 14px; border: 1px solid #334155; margin-bottom: 20px; display: none; }
    .form-box h3 { margin-bottom: 12px; font-size: 16px; color: #38bdf8; }
    .input-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; border: 1px solid #475569; color: white; font-size: 14px; }
    .form-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn-submit { flex: 1; background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: #475569; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; }

    /* List of Items */
    .item-card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .item-card.paid { opacity: 0.6; border-left: 4px solid #10b981; }
    .item-card.unpaid { border-left: 4px solid #f87171; }
    .item-left { display: flex; gap: 12px; align-items: center; }
    .item-icon { font-size: 24px; }
    .item-title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
    .item-sub { font-size: 12px; color: #94a3b8; }
    .item-right { text-align: right; }
    .item-amount { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .badge.paid { background: #064e3b; color: #34d399; }
    .badge.unpaid { background: #7f1d1d; color: #f87171; }
    .btn-del { background: none; border: none; color: #64748b; font-size: 14px; cursor: pointer; margin-left: 8px; }

    /* Floating Add Button */
    .fab { position: fixed; bottom: 20px; right: 20px; background: #38bdf8; color: #0f172a; width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 28px; border: none; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>📊 My Hisab & Bills</h1>
      <button id="installAppBtn" class="install-btn">📲 Install App</button>
    </div>
  </header>

  <div class="container">
    <!-- Summary -->
    <div class="summary-grid">
      <div class="summary-card bills">
        <h4>कुल बिल</h4>
        <p id="totalBills">₹0</p>
      </div>
      <div class="summary-card emi">
        <h4>कुल EMI</h4>
        <p id="totalEMI">₹0</p>
      </div>
      <div class="summary-card sip">
        <h4>कुल SIP</h4>
        <p id="totalSIP">₹0</p>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="filterItems('all', this)">सभी (All)</button>
      <button class="tab-btn" onclick="filterItems('credit_card', this)">💳 क्रेडिट कार्ड</button>
      <button class="tab-btn" onclick="filterItems('utility', this)">💡 बिजली / रिचार्ज</button>
      <button class="tab-btn" onclick="filterItems('emi', this)">🏠 लोन EMI</button>
      <button class="tab-btn" onclick="filterItems('sip', this)">📈 SIP / निवेश</button>
    </div>

    <!-- Entry Form -->
    <div id="formBox" class="form-box">
      <h3 id="formTitle">नया बिल या EMI जोड़ें</h3>
      <form id="entryForm" onsubmit="saveEntry(event)">
        <div class="input-group">
          <label>प्रकार (Category)</label>
          <select id="entryCategory" required>
            <option value="credit_card">💳 क्रेडिट कार्ड बिल (Credit Card)</option>
            <option value="utility">💡 बिजली बिल (Electricity)</option>
            <option value="utility">📱 फोन / रिचार्ज (Mobile Recharge)</option>
            <option value="emi">🏠 होम लोन EMI (Home Loan)</option>
            <option value="emi">🚗 कार / बाइक लोन EMI (Car Loan)</option>
            <option value="emi">👤 पर्सनल लोन EMI (Personal Loan)</option>
            <option value="sip">📈 SIP / म्यूचुअल फंड (Investment)</option>
          </select>
        </div>
        <div class="input-group">
          <label>नाम / बैंक का नाम (Name / Bank)</label>
          <input type="text" id="entryTitle" placeholder="उदा: HDFC Card या SBI Loan" required>
        </div>
        <div class="input-group">
          <label>रुपये (Amount ₹)</label>
          <input type="number" id="entryAmount" placeholder="उदा: 5000" required>
        </div>
        <div class="input-group">
          <label>अंतिम तारीख / EMI तारीख (Due Date)</label>
          <input type="date" id="entryDate" required>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="toggleForm(false)">कैंसिल</button>
          <button type="submit" class="btn-submit">सेव करें (Save)</button>
        </div>
      </form>
    </div>

    <!-- Item List -->
    <div id="itemList"></div>
  </div>

  <button class="fab" onclick="toggleForm(true)">+</button>

  <script>
    // LocalStorage Data Setup
    let data = JSON.parse(localStorage.getItem('my_hisab_data')) || [];
    let currentCategory = 'all';

    const icons = {
      credit_card: '💳',
      utility: '⚡',
      emi: '🏦',
      sip: '📈'
    };

    function toggleForm(show) {
      document.getElementById('formBox').style.display = show ? 'block' : 'none';
      if(show) {
        document.getElementById('entryForm').reset();
        document.getElementById('entryDate').valueAsDate = new Date();
      }
    }

    function saveEntry(e) {
      e.preventDefault();
      const newEntry = {
        id: Date.now(),
        category: document.getElementById('entryCategory').value,
        title: document.getElementById('entryTitle').value,
        amount: parseFloat(document.getElementById('entryAmount').value),
        date: document.getElementById('entryDate').value,
        status: 'unpaid'
      };
      data.push(newEntry);
      localStorage.setItem('my_hisab_data', JSON.stringify(data));
      toggleForm(false);
      render();
    }

    function toggleStatus(id) {
      data = data.map(item => item.id === id ? { ...item, status: item.status === 'paid' ? 'unpaid' : 'paid' } : item);
      localStorage.setItem('my_hisab_data', JSON.stringify(data));
      render();
    }

    function deleteItem(id) {
      if(confirm('क्या आप इसे हटाना चाहते हैं?')) {
        data = data.filter(item => item.id !== id);
        localStorage.setItem('my_hisab_data', JSON.stringify(data));
        render();
      }
    }

    function filterItems(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const listEl = document.getElementById('itemList');
      listEl.innerHTML = '';

      let billTotal = 0, emiTotal = 0, sipTotal = 0;

      data.forEach(item => {
        if(item.category === 'credit_card' || item.category === 'utility') billTotal += item.amount;
        if(item.category === 'emi') emiTotal += item.amount;
        if(item.category === 'sip') sipTotal += item.amount;
      });

      document.getElementById('totalBills').innerText = '₹' + billTotal.toLocaleString('en-IN');
      document.getElementById('totalEMI').innerText = '₹' + emiTotal.toLocaleString('en-IN');
      document.getElementById('totalSIP').innerText = '₹' + sipTotal.toLocaleString('en-IN');

      const filtered = currentCategory === 'all' ? data : data.filter(d => d.category === currentCategory);

      if(filtered.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; color:#64748b; margin-top:40px;">कोई एंट्री नहीं मिली। नीचे + बटन से जोड़ें!</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.status}`;
        card.innerHTML = `
          <div class="item-left">
            <span class="item-icon">${icons[item.category] || '📄'}</span>
            <div>
              <div class="item-title">${item.title}</div>
              <div class="item-sub">तारीख: ${item.date}</div>
            </div>
          </div>
          <div class="item-right">
            <div class="item-amount">₹${item.amount.toLocaleString('en-IN')}</div>
            <span class="badge ${item.status}" onclick="toggleStatus(${item.id})">
              ${item.status === 'paid' ? '✓ Paid' : 'Pending'}
            </span>
            <button class="btn-del" onclick="deleteItem(${item.id})">🗑️</button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    render();

    // PWA Install Prompt Logic
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
